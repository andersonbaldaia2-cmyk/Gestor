name: Gerar APK do Painel

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'icone.svg'
      - 'icone-foreground.svg'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/gerar-apk.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Verificar sintaxe e arquivos
        run: npm run check:app

      - name: Preparar arquivos web
        run: npm run build:android

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar ícones Android (legado e adaptativo)
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          RES=android/app/src/main/res
          mkdir -p "$RES/mipmap-mdpi" "$RES/mipmap-hdpi" "$RES/mipmap-xhdpi" "$RES/mipmap-xxhdpi" "$RES/mipmap-xxxhdpi" "$RES/mipmap-anydpi-v26" "$RES/drawable-nodpi" "$RES/values"
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            convert -background none -density 384 icone.svg -resize "${2}x${2}!" "$RES/mipmap-${1}/ic_launcher.png"
            cp "$RES/mipmap-${1}/ic_launcher.png" "$RES/mipmap-${1}/ic_launcher_round.png"
          done
          convert -background none -density 384 icone-foreground.svg -resize 432x432! "$RES/drawable-nodpi/ic_launcher_foreground.png"
          cat > "$RES/values/ic_launcher_background.xml" <<'EOF'
          <resources>
            <color name="ic_launcher_background">#090611</color>
          </resources>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Compilar APK de depuração
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Calcular SHA-256
        run: |
          cd android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Painel-APK-atualizado
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          retention-days: 30
          if-no-files-found: error
