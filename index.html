<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090611">
<meta name="description" content="Painel pessoal para organizar pessoas, atividades e registros.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icone.svg" type="image/svg+xml">
<title>Painel</title>
<style>
:root{color-scheme:dark;--bg:#090611;--bg2:#10091b;--surface:#151020;--surface2:#1b1429;--line:#30213f;--text:#f7f1ff;--muted:#a99ab9;--purple:#9b55ff;--pink:#ed3fba;--mint:#8be0c1;--amber:#f1c77c;--red:#ff829c;--grad:linear-gradient(120deg,#9a4cff,#e63ab9);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-width:320px;min-height:100vh;color:var(--text);background:radial-gradient(ellipse at 16% 0%,#40146545,transparent 38%),radial-gradient(ellipse at 100% 48%,#7b1a6b20,transparent 35%),var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #bd83ff;outline-offset:2px}
.app{width:min(100%,760px);min-height:100vh;margin:auto;padding-bottom:calc(102px + env(safe-area-inset-bottom))}
.topbar{height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;background:#0a0612dc;border-bottom:1px solid #ffffff0c;backdrop-filter:blur(18px)}
.identity{display:flex;align-items:center;gap:12px}.symbol{width:40px;height:40px;border-radius:14px;background:linear-gradient(145deg,#a04aff,#6919a4 55%,#e73cb5);box-shadow:0 5px 26px #9a3eff50;display:grid;place-items:center}.symbol svg{width:23px;height:23px;stroke:white;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.topmeta{display:grid;gap:2px}.topmeta b{font-size:12px;letter-spacing:.21em}.topmeta small{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.iconbtn{width:42px;height:42px;border:1px solid #ffffff12;border-radius:14px;color:#e8d9ff;background:#ffffff08;display:grid;place-items:center;transition:transform .2s,border-color .2s,background .2s}.iconbtn:active{transform:scale(.92)}.iconbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{padding:25px 18px 22px;animation:pageIn .38s ease both}@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 20px}.eyebrow{margin:0 0 6px;color:#c28aff;font-size:9px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}.pagehead h1{margin:0;font-size:clamp(23px,6vw,31px);line-height:1.08;letter-spacing:-.045em}.pagehead p{margin:7px 0 0;color:var(--muted);font-size:11px}
.primary{border:0;color:white;background:var(--grad);box-shadow:0 7px 24px #963cf044;border-radius:13px;padding:11px 14px;font-size:11px;font-weight:750;display:inline-flex;align-items:center;gap:7px;transition:transform .2s,filter .2s}.primary:active{transform:scale(.96);filter:brightness(1.15)}.primary svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 24px}.stat{min-height:105px;padding:15px;border:1px solid #ffffff10;border-radius:17px;background:linear-gradient(145deg,#211530d9,#130e1d);position:relative;overflow:hidden;animation:rise .5s both;animation-delay:var(--delay,0s)}.stat:after{content:"";position:absolute;width:86px;height:86px;right:-28px;top:-27px;border-radius:50%;background:var(--glow,#9b55ff);filter:blur(35px);opacity:.22}.stathead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:10px}.stathead svg{width:17px;height:17px;stroke:var(--accent,#c18bff);fill:none;stroke-width:1.8}.stat strong{display:block;font-size:29px;letter-spacing:-.06em;margin-top:12px}.sectionline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 12px}.sectionline h2{margin:0;font-size:14px;letter-spacing:-.02em}.sectionline span{font-size:10px;color:var(--muted)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:0 0 23px}.quick button{min-height:76px;padding:12px 8px;border:1px solid #ffffff10;border-radius:15px;background:#ffffff07;color:var(--text);display:grid;justify-items:center;align-content:center;gap:7px;transition:transform .2s,border-color .2s,background .2s}.quick button:active{transform:scale(.95);border-color:#a65cff80;background:#a65cff16}.quick svg{width:21px;height:21px;stroke:#d2a7ff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.quick span{font-size:10px;color:#d7cbe4}
.searchbox{position:relative;margin-bottom:13px}.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#a997bc;fill:none;stroke-width:1.8}.searchbox input{padding-left:40px}.field input,.field select,.field textarea,.searchbox input{width:100%;border:1px solid #ffffff13;border-radius:12px;background:#100b18;color:var(--text);padding:12px 13px;font-size:12px}.field input::placeholder,.field textarea::placeholder,.searchbox input::placeholder{color:#786b88}.field select{appearance:none}.field textarea{min-height:82px;resize:vertical}.field{display:grid;gap:6px;color:#c9bdd6;font-size:10px;font-weight:650}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full,.formactions{grid-column:1/-1}.formpanel{padding:17px;border:1px solid #ffffff12;background:#140f1e;border-radius:18px}.formactions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.ghost{border:1px solid #ffffff18;border-radius:12px;background:#ffffff08;color:#e9def5;padding:10px 13px;font-size:11px;font-weight:650}.list{display:grid;gap:9px}.item{width:100%;min-width:0;text-align:left;padding:12px;border:1px solid #ffffff10;border-radius:16px;background:linear-gradient(110deg,#1a1326,#120d1b);color:var(--text);display:flex;align-items:center;gap:11px;transition:transform .2s,border-color .2s}.item:active{transform:scale(.99);border-color:#9e5cff80}.avatar{width:42px;height:42px;border-radius:14px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,#8140d7,#3d1d60);color:white;font-weight:800;font-size:12px;box-shadow:0 5px 16px #7f39d333}.itembody{flex:1;min-width:0}.itembody b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.itembody small{display:block;margin-top:4px;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chevron{width:16px;height:16px;stroke:#9f8eaf;fill:none;stroke-width:1.8;flex:none}.tag{border:1px solid #ffffff12;border-radius:30px;padding:5px 8px;font-size:9px;color:var(--mint);background:#8be0c112;white-space:nowrap}.tag.pending{color:var(--amber);background:#f1c77c10}.tag.absent{color:var(--red);background:#ff829c10}.tag.neutral{color:#c8b4e0;background:#a77bcb14}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed #ffffff1a;border-radius:16px;font-size:11px}.empty svg{width:27px;height:27px;stroke:#9d6bd4;fill:none;stroke-width:1.5;margin-bottom:8px}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);height:75px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:#0d0816ed;border-top:1px solid #ffffff12;backdrop-filter:blur(20px);z-index:30}.navbtn{border:0;background:none;color:#8e809e;display:grid;justify-items:center;align-content:center;gap:4px;min-width:0;height:56px;border-radius:13px;transition:color .2s,background .2s}.navbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.navbtn.active{color:#e6c9ff;background:#a14cff16}.navbtn.add{width:48px;height:48px;justify-self:center;border-radius:16px;background:var(--grad);color:white;box-shadow:0 6px 24px #973cff55}.navbtn.add svg{width:23px;height:23px}
.sheet{border:1px solid #ffffff12;background:linear-gradient(145deg,#1a1326,#110c19);border-radius:18px;padding:16px;margin:13px 0}.sheettop{display:flex;justify-content:space-between;gap:12px;align-items:center}.sheettop h2{font-size:14px;margin:0}.sheet p{color:var(--muted);font-size:10px;line-height:1.5}.metricrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:12px 8px;background:#ffffff07;border:1px solid #ffffff0e;border-radius:13px;text-align:center}.metric b{font-size:19px;display:block}.metric span{font-size:9px;color:var(--muted)}
.actionsrow{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}.danger{color:#ff9bab;border-color:#6f3545;background:#321722}.divider{height:1px;background:#ffffff12;margin:16px 0}
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,15px);opacity:0;pointer-events:none;z-index:60;padding:11px 15px;border-radius:30px;background:#271638;border:1px solid #9e54e855;color:#f5eaff;font-size:11px;box-shadow:0 8px 30px #0008;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}@keyframes pulseGlow{50%{box-shadow:0 0 28px #923cff3b}}@media(min-width:650px){main{padding:32px 28px}.stats{grid-template-columns:repeat(4,1fr)}.stat{min-height:112px}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{grid-template-columns:repeat(3,150px)}}
@media(max-width:390px){main{padding:21px 14px}.pagehead h1{font-size:24px}.item{padding:10px}.avatar{width:38px;height:38px}.formgrid{grid-template-columns:1fr}.field.full,.formactions{grid-column:auto}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Acabamento fosco: reduzir brilho e manter a identidade roxo/magenta */
body{
  background:
    radial-gradient(ellipse at 16% 0%,#4014651c,transparent 38%),
    radial-gradient(ellipse at 100% 48%,#7b1a6b10,transparent 35%),
    var(--bg);
}
.symbol{
  background:linear-gradient(145deg,#8640cf,#58158a 58%,#b82f91);
  box-shadow:0 2px 10px #6d28a01c;
}
.primary{
  background:linear-gradient(120deg,#8040cf,#bd328f);
  box-shadow:0 3px 10px #8737b21c;
}
.stat:after{
  width:58px;height:58px;
  filter:blur(28px);
  opacity:.07;
}
.avatar{
  background:linear-gradient(145deg,#7136ad,#351b4d);
  box-shadow:none;
}
.navbtn.add{
  background:linear-gradient(145deg,#8740d2,#bd328f);
  box-shadow:0 3px 10px #8737b226;
}
.navbtn.active{
  color:#d9b8fa;
  background:#a14cff0c;
}
.quick button:active{
  border-color:#a65cff42;
  background:#a65cff0b;
}
.item:active{
  border-color:#9e5cff45;
}
.toast{
  background:#20132c;
  border-color:#77439a66;
  box-shadow:0 4px 14px #0005;
}

</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="identity"><div class="symbol" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3 20 12 12 21 4 12 12 3Z"/><path d="m12 8 4 4-4 4-4-4 4-4Z"/></svg></div><div class="topmeta"><b>PAINEL</b><small>ESPAÇO DE ORGANIZAÇÃO</small></div></div>
  <button class="iconbtn" id="topBackup" title="Backup" aria-label="Backup"><svg viewBox="0 0 24 24"><path d="M12 15V3m-4 4 4-4 4 4"/><path d="M4 14v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg></button>
</header>
<main id="view"></main>
<nav class="bottomnav" aria-label="Navegação principal">
<button class="navbtn active" data-tab="home" title="Início" aria-label="Início"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1V10Z"/></svg></button>
<button class="navbtn" data-tab="people" title="Pessoas" aria-label="Pessoas"><svg viewBox="0 0 24 24"><path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="4"/><path d="M17 11a4 4 0 1 0-1-7.9M21 20v-1.5a4 4 0 0 0-3-3.87"/></svg></button>
<button class="navbtn add" data-tab="new" title="Adicionar" aria-label="Adicionar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<button class="navbtn" data-tab="records" title="Registros" aria-label="Registros"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M16 2v4M8 2v4M3 10h18m-13 4h3m-3 3h7"/></svg></button>
<button class="navbtn" data-tab="data" title="Dados" aria-label="Dados"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></svg></button>
</nav>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
</div>
<script>
(function(){
'use strict';
const DB='autogestor-cfc',VERSION=1;
let db,view=document.getElementById('view'),tab='home',activePerson=null,toastTimer;
const icons={
search:'<svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>',
plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
user:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
check:'<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>',
clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
alert:'<svg viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v5m0 3h.01"/></svg>',
arrow:'<svg class="chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
empty:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>',
edit:'<svg viewBox="0 0 24 24"><path d="m14 5 5 5M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/></svg>',
trash:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m3 0-1 14H6L5 6m4 4v6m6-6v6"/></svg>'
};
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function today(){let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function date(v){return v?v.split('-').reverse().join('/'):'—'}
function initials(v){return (v||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}
function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,VERSION);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('alunos'))d.createObjectStore('alunos',{keyPath:'id'});if(!d.objectStoreNames.contains('aulas')){let s=d.createObjectStore('aulas',{keyPath:'id'});s.createIndex('alunoId','alunoId',{unique:false})}};r.onsuccess=()=>{db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((resolve,reject)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function save(store,item){return new Promise((resolve,reject)=>{try{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(item);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Falha ao gravar'));tx.onabort=()=>reject(tx.error||new Error('Gravação cancelada'));}catch(error){reject(error)}})}
function remove(store,id){return new Promise((resolve,reject)=>{let t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=resolve;t.onerror=()=>reject(t.error)})}
function statsFor(records,total){let done=records.filter(x=>['Realizada','Concluído'].includes(x.status)).length,miss=records.filter(x=>['Faltou','Falta','Ausência'].includes(x.status)).length,pending=records.filter(x=>['Agendada','Reagendada','Pendente'].includes(x.status)).length;return{done,miss,pending,left:Math.max(0,(Number(total)||0)-done)}}
function statusLabel(s){return ({Realizada:'Concluído',Faltou:'Ausência',Falta:'Ausência',Agendada:'Pendente',Reagendada:'Reagendado',Cancelada:'Cancelado'})[s]||s||'Pendente'}
function statusClass(s){let x=statusLabel(s);return x==='Concluído'?'':x==='Ausência'?'absent':x==='Pendente'||x==='Reagendado'?'pending':'neutral'}
function head(k,desc,action){return '<div class="pagehead"><div><p class="eyebrow">VISÃO GERAL</p><h1>'+k+'</h1>'+(desc?'<p>'+desc+'</p>':'')+'</div>'+(action||'')+'</div>'}
function pageTransition(){view.classList.remove('loaded');void view.offsetWidth;view.classList.add('loaded')}
function setTab(next){tab=next;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function actionButton(label,fn,ico='plus'){return '<button class="primary" data-action="'+fn+'">'+icons[ico]+'<span>'+label+'</span></button>'}
async function render(){
 document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 if(tab==='home')return home();if(tab==='people')return people();if(tab==='records')return records();if(tab==='data')return dataPage();if(tab==='new')return personForm();
}
async function home(){
 let people=await all('alunos'),records=await all('aulas'),s=statsFor(records,0),active=people.filter(p=>(p.status||'Ativo')==='Ativo').length;
 let recent=records.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,4);
 let recentHtml='';
 for(let r of recent){let p=people.find(x=>x.id===r.alunoId);recentHtml+='<button class="item" data-open-record="'+esc(r.id)+'"><span class="avatar">'+icons.calendar+'</span><span class="itembody"><b>'+esc(p?p.name:'Registro')+'</b><small>'+date(r.date)+' · '+esc(r.time||'')+'</small></span><span class="tag '+statusClass(r.status)+'">'+esc(statusLabel(r.status))+'</span>'+icons.arrow+'</button>'}
 view.innerHTML=head('Painel','Seu espaço, em ordem.',actionButton('Adicionar','new'))+
 '<section class="stats">'+
 '<article class="stat" style="--delay:.02s;--glow:#994cff"><div class="stathead">Pessoas '+icons.user+'</div><strong>'+people.length+'</strong></article>'+
 '<article class="stat" style="--delay:.08s;--glow:#ed3fba"><div class="stathead">Concluídos '+icons.check+'</div><strong>'+s.done+'</strong></article>'+
 '<article class="stat" style="--delay:.14s;--glow:#e3b65e"><div class="stathead">Pendentes '+icons.clock+'</div><strong>'+s.pending+'</strong></article>'+
 '<article class="stat" style="--delay:.20s;--glow:#f06f9c"><div class="stathead">Ausências '+icons.alert+'</div><strong>'+s.miss+'</strong></article></section>'+
 '<div class="sectionline"><h2>Acesso rápido</h2><span>'+active+' ativos</span></div>'+
 '<div class="quick"><button data-tab="people">'+icons.user+'<span>Pessoas</span></button><button data-tab="records">'+icons.calendar+'<span>Registros</span></button><button data-tab="data">'+icons.check+'<span>Dados</span></button></div>'+
 '<div class="sectionline"><h2>Recentes</h2><span>'+records.length+' registros</span></div><div class="list">'+(recentHtml||'<div class="empty">'+icons.empty+'<br>Nenhum registro por aqui.</div>')+'</div>';
 pageTransition();
}
async function people(q=''){
 let arr=(await all('alunos')).sort((a,b)=>(a.name||'').localeCompare(b.name||'','pt-BR')),query=(q||'').toLocaleLowerCase('pt-BR'),html='';
 for(let p of arr){if(query&&!((p.name+' '+(p.phone||'')).toLocaleLowerCase('pt-BR').includes(query)))continue;html+='<button class="item" data-person="'+esc(p.id)+'"><span class="avatar">'+esc(initials(p.name))+'</span><span class="itembody"><b>'+esc(p.name)+'</b><small>'+esc(p.phone||'Sem contato')+' · '+esc(p.category||'Sem categoria')+'</small></span><span class="tag">'+esc(p.status||'Ativo')+'</span>'+icons.arrow+'</button>'}
 view.innerHTML=head('Pessoas','Cadastros e informações.',actionButton('Novo','new'))+
 '<div class="searchbox">'+icons.search+'<input id="personSearch" placeholder="Buscar..." value="'+esc(q)+'" autocomplete="off"></div>'+
 '<div class="list">'+(html||'<div class="empty">'+icons.empty+'<br>Nenhum cadastro encontrado.</div>')+'</div>';
 pageTransition();
}
async function records(){
 let rec=(await all('aulas')).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')),people=await all('alunos'),html='';
 for(let r of rec){let p=people.find(x=>x.id===r.alunoId);html+='<button class="item" data-record="'+esc(r.id)+'"><span class="avatar">'+icons.calendar+'</span><span class="itembody"><b>'+esc(p?p.name:'Registro')+'</b><small>'+date(r.date)+' · '+esc(r.time||'')+' · '+esc(r.duration||'—')+' min</small></span><span class="tag '+statusClass(r.status)+'">'+esc(statusLabel(r.status))+'</span>'+icons.arrow+'</button>'}
 view.innerHTML=head('Registros','Atividades e histórico.',actionButton('Novo','newrecord'))+'<div class="list">'+(html||'<div class="empty">'+icons.empty+'<br>Nenhum registro criado.</div>')+'</div>';pageTransition();
}
async function personForm(person){
 person=person||{};let editing=!!person.id;
 view.innerHTML=head(editing?'Editar pessoa':'Nova pessoa','Informações essenciais.')+
 '<form id="personForm" class="formpanel formgrid">'+
 '<input type="hidden" name="id" value="'+esc(person.id)+'">'+
 '<label class="field full">Nome<input name="name" maxlength="90" required value="'+esc(person.name)+'" placeholder="Nome completo"></label>'+
 '<label class="field">Contato<input name="phone" value="'+esc(person.phone)+'" placeholder="Telefone ou contato"></label>'+
 '<label class="field">Documento<input name="cpf" value="'+esc(person.cpf)+'" placeholder="Opcional"></label>'+
 '<label class="field">Data de cadastro<input name="enrolled" type="date" value="'+esc(person.enrolled||today())+'"></label>'+
 '<label class="field">Categoria<input name="category" value="'+esc(person.category)+'" placeholder="Categoria"></label>'+
 '<label class="field">Tipo<input name="vehicle" value="'+esc(person.vehicle)+'" placeholder="Tipo"></label>'+
 '<label class="field">Meta<input name="total" type="number" min="0" value="'+esc(person.total==null?'':person.total)+'" placeholder="0"></label>'+
 '<label class="field">Situação<select name="status"><option '+(!person.status||person.status==='Ativo'?'selected':'')+'>Ativo</option><option '+(person.status==='Pausado'?'selected':'')+'>Pausado</option><option '+(person.status==='Concluído'?'selected':'')+'>Concluído</option></select></label>'+
 '<label class="field full">Notas<textarea name="notes" placeholder="Anotações opcionais">'+esc(person.notes)+'</textarea></label>'+
 '<div class="formactions"><button type="button" class="ghost" data-tab="people">Cancelar</button><button class="primary" type="button" id="savePersonButton">'+icons.check+'<span>Salvar</span></button></div></form>';
 pageTransition();
}
async function detail(id){
 activePerson=id;let p=(await all('alunos')).find(x=>x.id===id);if(!p){tab='people';return render()}
 let rec=(await all('aulas')).filter(x=>x.alunoId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),s=statsFor(rec,p.total),html='';
 rec.forEach(r=>{html+='<article class="item"><span class="avatar">'+icons.calendar+'</span><span class="itembody"><b>'+date(r.date)+' · '+esc(r.time||'')+'</b><small>'+esc(r.duration||'—')+' min · '+esc(r.instructor||'Sem responsável')+'</small></span><span class="tag '+statusClass(r.status)+'">'+esc(statusLabel(r.status))+'</span><span class="record-actions"><button class="iconbtn" data-edit-record="'+esc(r.id)+'" title="Editar">'+icons.edit+'</button><button class="iconbtn" data-delete-record="'+esc(r.id)+'" title="Excluir">'+icons.trash+'</button></span></article>'});
 view.innerHTML=head('Perfil','', '<button class="iconbtn" data-tab="people" title="Voltar">'+icons.arrow+'</button>')+
 '<section class="sheet"><div class="sheettop"><div style="display:flex;align-items:center;gap:11px"><span class="avatar">'+esc(initials(p.name))+'</span><div><h2>'+esc(p.name)+'</h2><p style="margin:4px 0 0">'+esc(p.phone||'Sem contato')+'</p></div></div><button class="iconbtn" data-edit-person="'+esc(p.id)+'" title="Editar">'+icons.edit+'</button></div><div class="divider"></div><div class="metricrow"><div class="metric"><b>'+s.done+'</b><span>Feitos</span></div><div class="metric"><b>'+s.pending+'</b><span>Pendentes</span></div><div class="metric"><b>'+s.left+'</b><span>Restantes</span></div></div><p>Categoria: '+esc(p.category||'—')+' · Tipo: '+esc(p.vehicle||'—')+'</p><p>Meta: '+esc(p.total||0)+' · Situação: '+esc(p.status||'Ativo')+'</p><p>'+esc(p.notes||'')+'</p></section>'+
 '<div class="sectionline"><h2>Histórico</h2><button class="primary" data-new-record="'+esc(p.id)+'">'+icons.plus+'<span>Adicionar</span></button></div>'+
 '<div class="list">'+(html||'<div class="empty">'+icons.empty+'<br>Sem registros ainda.</div>')+'</div>'+
 '<div class="actionsrow"><button class="ghost danger" data-delete-person="'+esc(p.id)+'">'+icons.trash+' Excluir perfil</button></div>';
 pageTransition();
}
function legacyStatus(s){return ({'Pendente':'Agendada','Concluído':'Realizada','Ausência':'Faltou','Cancelado':'Cancelada','Reagendado':'Reagendada'})[s]||s}
async function recordForm(personId,recordId){
 let rec=await all('aulas'),r=recordId?rec.find(x=>x.id===recordId):{},p=personId?(await all('alunos')).find(x=>x.id===personId):null,ps=await all('alunos');
 if(!p&&r)p=ps.find(x=>x.id===r.alunoId);if(!p)p=ps[0];if(!p){toast('Cadastre uma pessoa primeiro.');return personForm()}
 view.innerHTML=head(recordId?'Editar registro':'Novo registro','Informações do registro.')+
 '<form id="recordForm" class="formpanel formgrid"><input type="hidden" name="id" value="'+esc(r.id)+'"><input type="hidden" name="personId" value="'+esc(p.id)+'">'+
 '<label class="field full">Pessoa<select name="alunoId">'+ps.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select></label>'+
 '<label class="field">Data<input type="date" name="date" required value="'+esc(r.date||today())+'"></label><label class="field">Horário<input type="time" name="time" value="'+esc(r.time||'09:00')+'"></label>'+
 '<label class="field">Situação<select name="status">'+['Pendente','Concluído','Ausência','Cancelado','Reagendado'].map(x=>'<option '+(statusLabel(r.status||'Agendada')===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label>'+
 '<label class="field">Duração (min)<input type="number" min="0" max="999" name="duration" value="'+esc(r.duration||'')+'"></label>'+
 '<label class="field">Responsável<input name="instructor" value="'+esc(r.instructor)+'" placeholder="Opcional"></label><label class="field">Tipo<input name="vehicle" value="'+esc(r.vehicle||p.vehicle||'')+'" placeholder="Opcional"></label>'+
 '<label class="field full">Notas<textarea name="notes" placeholder="Anotações opcionais">'+esc(r.notes)+'</textarea></label>'+
 '<div class="formactions"><button type="button" class="ghost" data-tab="records">Cancelar</button><button type="submit" class="primary">'+icons.check+'<span>Salvar</span></button></div></form>';
 pageTransition();
}
async function dataPage(){
 let p=await all('alunos'),r=await all('aulas');
 view.innerHTML=head('Dados','Backup e segurança.')+
 '<section class="sheet"><div class="sheettop"><h2>Armazenamento local</h2><span class="tag">Ativo</span></div><p>Seus dados ficam neste aparelho.</p><div class="metricrow"><div class="metric"><b>'+p.length+'</b><span>Pessoas</span></div><div class="metric"><b>'+r.length+'</b><span>Registros</span></div><div class="metric"><b>100%</b><span>Local</span></div></div></section>'+
 '<section class="sheet"><div class="sheettop"><h2>Backup</h2>'+icons.check+'</div><p>Exporte uma cópia ou restaure seus dados.</p><div class="actionsrow"><button class="ghost" id="restore">'+icons.arrow+' Restaurar</button><button class="primary" id="export">'+icons.check+'<span>Exportar</span></button></div></section>';
 pageTransition();
}
async function backup(){let p=await all('alunos'),r=await all('aulas'),blob=new Blob([JSON.stringify({app:'Painel',version:2,exported:new Date().toISOString(),students:p,lessons:r},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='painel-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exportado')}
async function restoreFile(file){let data=JSON.parse(await file.text());if(!Array.isArray(data.students)||!Array.isArray(data.lessons))throw new Error('Arquivo inválido');let t=db.transaction(['alunos','aulas'],'readwrite');t.objectStore('alunos').clear();t.objectStore('aulas').clear();data.students.forEach(x=>t.objectStore('alunos').put(x));data.lessons.forEach(x=>t.objectStore('aulas').put(x));await new Promise((resolve,reject)=>{t.oncomplete=resolve;t.onerror=()=>reject(t.error)});toast('Backup restaurado');tab='home';render()}
document.addEventListener('click',async e=>{
 let b=e.target.closest('button');if(!b)return;
 if(b.id==='savePersonButton'){const form=document.getElementById('personForm');if(!form||!form.reportValidity())return;b.disabled=true;const label=b.innerHTML;b.innerHTML=icons.clock+'<span>Salvando...</span>';try{const person=Object.fromEntries(new FormData(form).entries());person.id=person.id||uid();person.total=Number(person.total||0);await save('alunos',person);toast('Cadastro salvo');setTab('people')}catch(error){console.error('Erro ao salvar cadastro:',error);toast('Erro ao salvar: '+(error.message||'verifique o armazenamento'))}finally{b.disabled=false;b.innerHTML=label}return}
 if(b.dataset.tab){setTab(b.dataset.tab);return}
 if(b.dataset.action==='new'){setTab('new');return}
 if(b.dataset.action==='newrecord'){await recordForm();return}
 if(b.dataset.person){await detail(b.dataset.person);return}
 if(b.dataset.openRecord||b.dataset.record){let id=b.dataset.openRecord||b.dataset.record;let r=(await all('aulas')).find(x=>x.id===id);if(r)await detail(r.alunoId);return}
 if(b.dataset.editPerson){let p=(await all('alunos')).find(x=>x.id===b.dataset.editPerson);await personForm(p);return}
 if(b.dataset.newRecord){await recordForm(b.dataset.newRecord);return}
 if(b.dataset.editRecord){let r=(await all('aulas')).find(x=>x.id===b.dataset.editRecord);if(r)await recordForm(r.alunoId,r.id);return}
 if(b.dataset.deleteRecord){if(confirm('Excluir este registro?')){await remove('aulas',b.dataset.deleteRecord);await detail(activePerson)}return}
 if(b.dataset.deletePerson){if(confirm('Excluir este perfil e seu histórico?')){for(let x of (await all('aulas')).filter(x=>x.alunoId===b.dataset.deletePerson))await remove('aulas',x.id);await remove('alunos',b.dataset.deletePerson);toast('Perfil excluído');setTab('people')}return}
 if(b.id==='topBackup')return setTab('data');
 if(b.id==='export')return backup();
 if(b.id==='restore')return document.getElementById('restoreFile').click();
});
document.addEventListener('submit',async e=>{
 if(e.target.id==='personForm'){e.preventDefault();let f=new FormData(e.target),person=Object.fromEntries(f.entries());person.id=person.id||uid();person.total=Number(person.total||0);try{await save('alunos',person);toast('Cadastro salvo');setTab('people')}catch(err){toast('Não foi possível salvar')}} 
 if(e.target.id==='recordForm'){e.preventDefault();let f=new FormData(e.target),record=Object.fromEntries(f.entries());record.id=record.id||uid();record.alunoId=record.alunoId||record.personId;record.status=legacyStatus(record.status);record.duration=Number(record.duration||0);delete record.personId;try{await save('aulas',record);toast('Registro salvo');activePerson=record.alunoId;await detail(activePerson)}catch(err){toast('Não foi possível salvar')}} 
});
document.addEventListener('input',e=>{if(e.target.id==='personSearch'){let v=e.target.value;people(v).then(()=>{let n=document.getElementById('personSearch');if(n){n.focus();n.setSelectionRange(v.length,v.length)}})}});
document.getElementById('restoreFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{if(confirm('A restauração substituirá os dados atuais. Continuar?'))await restoreFile(f)}catch(err){toast('Arquivo de backup inválido')}e.target.value=''});
openDB().then(render).catch(()=>{view.innerHTML='<div class="empty">Não foi possível acessar o armazenamento local.</div>'});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
