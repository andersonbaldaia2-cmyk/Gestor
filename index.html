<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10"><meta name="description" content="Gestão local de alunos e aulas para autoescolas.">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icone.svg" type="image/svg+xml">
<title>AutoGestor CFC</title>
<style>
:root{color-scheme:dark;--bg:#0b0d10;--card:#14191f;--card2:#1a2028;--line:#29313b;--text:#f2f4f6;--muted:#9aa4af;--blue:#c9d9ff;--bluebg:#1c2b45;--green:#8bd8ad;--red:#f09a9a;--yellow:#e8c780;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-width:320px}.app{max-width:850px;margin:auto;padding-bottom:88px}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #ffffff0d;position:sticky;top:0;background:#0b0d10ed;backdrop-filter:blur(14px);z-index:4}.brand{display:flex;align-items:center;gap:11px;font-weight:750}.mark{width:36px;height:36px;border-radius:11px;background:var(--blue);color:#101722;display:grid;place-items:center;font-size:19px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.3px;font-weight:600}.wrap{padding:24px 18px}.eyebrow{color:var(--blue);font-size:10px;letter-spacing:1.5px;font-weight:800;margin:0 0 6px}h1{font-size:28px;letter-spacing:-.8px;margin:0 0 6px}h2{font-size:18px;margin:0}.muted{color:var(--muted);font-size:12px;line-height:1.5;margin:0}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:22px}.btn{border:1px solid var(--line);border-radius:11px;padding:11px 14px;background:var(--card2);color:var(--text);font-weight:700;font-size:12px}.primary{background:var(--blue);color:#111824;border-color:var(--blue)}.danger{color:var(--red);border-color:#633d43;background:#2b1b20}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0 26px}.stat,.panel,.student,.lesson{background:var(--card);border:1px solid var(--line);border-radius:15px}.stat{padding:13px;min-height:92px}.stat span{font-size:10px;color:var(--muted)}.stat strong{display:block;font-size:25px;margin-top:7px}.section{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.search{width:100%;margin:0 0 13px}.field input,.field select,.field textarea,.search{background:#0e1217;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);width:100%;font:inherit;font-size:13px}.list{display:grid;gap:9px}.student{width:100%;padding:13px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--text)}.avatar{width:42px;height:42px;border-radius:13px;background:#253247;color:var(--blue);display:grid;place-items:center;font-weight:800;flex-shrink:0}.grow{flex:1;min-width:0}.grow b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.grow small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.badge{font-size:10px;color:var(--green);background:#172c22;padding:5px 8px;border-radius:99px;white-space:nowrap}.badge.red{color:var(--red);background:#321f22}.badge.yellow{color:var(--yellow);background:#302918}.panel{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;font-size:11px;color:#cbd2d9;font-weight:650}.field.full{grid-column:1/-1}.field textarea{min-height:75px}.actions{display:flex;justify-content:flex-end;gap:8px;grid-column:1/-1;margin-top:5px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.summary div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.summary span{display:block;color:var(--muted);font-size:10px}.summary b{display:block;font-size:21px;margin-top:5px}.detailtop{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:16px 0}.lesson{padding:13px;margin-bottom:8px}.lessonrow{display:flex;justify-content:space-between;gap:10px;align-items:center}.lesson small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.lessonactions{display:flex;justify-content:flex-end;gap:6px;margin-top:10px}.lessonactions button{background:transparent;border:0;color:var(--blue);font-size:11px;padding:5px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,850px);display:grid;grid-template-columns:repeat(4,1fr);background:#11161cf5;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:var(--muted);font-size:10px;padding:5px}.nav button.active{color:var(--blue)}.nav i{display:block;font-style:normal;font-size:18px;margin-bottom:3px}.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:12px}.hidden{display:none!important}.note{background:#142033;border:1px solid #2b4162;border-radius:12px;padding:13px;color:#c6d7f3;font-size:11px;line-height:1.5;margin:14px 0}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr 1fr}.wrap{padding:21px 15px}.head{align-items:flex-start}.head .btn{white-space:nowrap;padding:10px}.grid{gap:10px}}
@media(max-width:370px){.grid{grid-template-columns:1fr}.field.full,.actions{grid-column:auto}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><span class="mark">A</span><span>AutoGestor<small>CONTROLE DE AUTOESCOLA</small></span></div><button class="btn" id="backupTop">Backup ↥</button></header>
<main class="wrap" id="view"><p class="muted">Carregando registros...</p></main>
<nav class="nav"><button data-tab="inicio" class="active"><i>⌂</i>Início</button><button data-tab="alunos"><i>▤</i>Alunos</button><button data-tab="novo"><i>＋</i>Cadastrar</button><button data-tab="dados"><i>◫</i>Dados</button></nav>
</div><input id="file" type="file" accept=".json,application/json" class="hidden">
<script>
(function(){
'use strict';
var DB='autogestor-cfc',VERSION=1,db,view=document.getElementById('view'),tab='inicio',studentId=null;
function openDB(){return new Promise(function(ok,no){var r=indexedDB.open(DB,VERSION);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains('alunos'))d.createObjectStore('alunos',{keyPath:'id'});if(!d.objectStoreNames.contains('aulas')){var s=d.createObjectStore('aulas',{keyPath:'id'});s.createIndex('alunoId','alunoId',{unique:false})}};r.onsuccess=function(){db=r.result;ok()};r.onerror=function(){no(r.error)}})}
function all(store){return new Promise(function(ok,no){var r=db.transaction(store).objectStore(store).getAll();r.onsuccess=function(){ok(r.result||[])};r.onerror=function(){no(r.error)}})}
function put(store,obj){return new Promise(function(ok,no){try{var t=db.transaction(store,'readwrite');t.objectStore(store).put(obj);t.oncomplete=function(){ok(true)};t.onerror=function(){no(t.error||new Error('Falha ao gravar no armazenamento local.'))};t.onabort=function(){no(t.error||new Error('Gravação cancelada pelo armazenamento local.'))}}catch(err){no(err)}})}
function del(store,id){return new Promise(function(ok,no){var t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);t.oncomplete=ok;t.onerror=function(){no(t.error)}})}
function id(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()}
function today(){var d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function date(s){return s? s.split('-').reverse().join('/'):'—'}
function initials(s){return (s||'?').trim().split(/\s+/).slice(0,2).map(function(x){return x[0]}).join('').toUpperCase()}
function count(lessons,total){var done=lessons.filter(function(x){return x.status==='Realizada'}).length;return {done:done,miss:lessons.filter(function(x){return x.status==='Faltou'}).length,scheduled:lessons.filter(function(x){return x.status==='Agendada'||x.status==='Reagendada'}).length,cancel:lessons.filter(function(x){return x.status==='Cancelada'}).length,left:Math.max(0,(+total||0)-done)}}
function title(k,desc,button){return '<div class="head"><div><p class="eyebrow">AUTOGESTOR CFC</p><h1>'+k+'</h1><p class="muted">'+desc+'</p></div>'+(button||'')+'</div>'}
function empty(msg){return '<div class="empty">'+msg+'</div>'}
function nav(){document.querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab)})}
async function home(search){var students=await all('alunos'),lessons=await all('aulas'),done=lessons.filter(function(x){return x.status==='Realizada'}).length,miss=lessons.filter(function(x){return x.status==='Faltou'}).length,scheduled=lessons.filter(function(x){return x.status==='Agendada'||x.status==='Reagendada'}).length;var q=(search||'').toLocaleLowerCase('pt-BR');students.sort(function(a,b){return a.name.localeCompare(b.name,'pt-BR')});var rows='';for(var s of students){var ls=lessons.filter(function(x){return x.alunoId===s.id}),c=count(ls,s.total);if(q&&!((s.name+' '+(s.phone||'')).toLocaleLowerCase('pt-BR').includes(q)))continue;rows+='<button class="student" data-open="'+esc(s.id)+'"><span class="avatar">'+esc(initials(s.name))+'</span><span class="grow"><b>'+esc(s.name)+'</b><small>'+esc(s.phone||'Telefone não informado')+' · '+esc(s.vehicle)+'</small></span><span class="badge">'+c.left+' restantes</span></button>'}
view.innerHTML=title(tab==='alunos'?'Alunos':'Painel inicial','Acesse o aluno para consultar dados e frequência.','<button class="btn primary" data-new>＋ Novo aluno</button>')+(tab==='inicio'?'<div class="stats"><div class="stat"><span>Alunos</span><strong>'+students.length+'</strong></div><div class="stat"><span>Presenças</span><strong>'+done+'</strong></div><div class="stat"><span>Faltas</span><strong>'+miss+'</strong></div><div class="stat"><span>Agendadas</span><strong>'+scheduled+'</strong></div></div>':'')+'<div class="section"><h2>Alunos cadastrados</h2><span class="muted">'+students.length+' no total</span></div><input class="search" id="search" placeholder="Buscar por nome ou telefone..." value="'+esc(search||'')+'"><div class="list">'+(rows||empty('Nenhum aluno encontrado. Cadastre o primeiro aluno para começar.'))+'</div>'}
async function studentForm(s){s=s||{};view.innerHTML=title(s.id?'Editar aluno':'Novo aluno','Preencha os dados do aluno.','<button class="btn" data-home>Voltar</button>')+'<form id="studentForm" class="panel grid"><input type="hidden" name="id" value="'+esc(s.id)+'"><label class="field" style="grid-column:1/-1">Nome completo *<input name="name" required maxlength="90" value="'+esc(s.name)+'" placeholder="Ex.: Gabriel Silva"></label><label class="field">Telefone<input name="phone" inputmode="tel" value="'+esc(s.phone)+'"></label><label class="field">CPF (opcional)<input name="cpf" value="'+esc(s.cpf)+'"></label><label class="field">Data da matrícula<input name="enrolled" type="date" value="'+esc(s.enrolled||today())+'"></label><label class="field">Categoria CNH<input name="category" value="'+esc(s.category)+'" placeholder="B"></label><label class="field">Veículo<select name="vehicle"><option '+(!s.vehicle||s.vehicle==='Manual'?'selected':'')+'>Manual</option><option '+(s.vehicle==='Automático'?'selected':'')+'>Automático</option></select></label><label class="field">Aulas contratadas<input name="total" type="number" min="0" value="'+esc(s.total==null?20:s.total)+'"></label><label class="field">Situação<select name="status"><option '+(!s.status||s.status==='Ativo'?'selected':'')+'>Ativo</option><option '+(s.status==='Pausado'?'selected':'')+'>Pausado</option><option '+(s.status==='Concluído'?'selected':'')+'>Concluído</option></select></label><label class="field" style="grid-column:1/-1">Observações<textarea name="notes">'+esc(s.notes)+'</textarea></label><div class="actions"><button type="button" class="btn" data-home>Cancelar</button><button type="button" class="btn primary" id="saveStudentButton">Salvar aluno</button></div></form>'}
async function detail(idv){studentId=idv;var s=(await all('alunos')).find(function(x){return x.id===idv});if(!s){tab='alunos';return render()}var lessons=(await all('aulas')).filter(function(x){return x.alunoId===idv}).sort(function(a,b){return (b.date+b.time).localeCompare(a.date+a.time)}),c=count(lessons,s.total);var html=title('Ficha do aluno','Dados e histórico individual.','<button class="btn" data-home>Voltar</button>')+'<div class="detailtop"><div><h2>'+esc(s.name)+'</h2><p class="muted">'+esc(s.phone||'Telefone não informado')+' · '+esc(s.vehicle)+'</p></div><button class="btn" data-edit="'+esc(s.id)+'">Editar</button></div><div class="summary"><div><span>Contratadas</span><b>'+esc(s.total)+'</b></div><div><span>Presenças</span><b>'+c.done+'</b></div><div><span>Faltas</span><b>'+c.miss+'</b></div><div><span>Restantes</span><b>'+c.left+'</b></div></div><div class="panel"><p class="muted">Matrícula: '+date(s.enrolled)+' · Categoria: '+esc(s.category||'—')+' · Situação: '+esc(s.status||'Ativo')+'</p><p class="muted">CPF: '+esc(s.cpf||'—')+'</p><p class="muted">Observações: '+esc(s.notes||'—')+'</p></div><div class="section"><h2>Histórico de aulas</h2><button class="btn primary" data-lesson>＋ Registrar aula</button></div>';
lessons.forEach(function(l){var cls=l.status==='Realizada'?'':l.status==='Faltou'?'red':l.status==='Agendada'?'yellow':'';html+='<article class="lesson"><div class="lessonrow"><div><b>'+date(l.date)+'</b><small>'+esc(l.time)+' · '+esc(l.duration||'—')+' min</small></div><span class="badge '+cls+'">'+esc(l.status)+'</span></div><small>'+esc(l.instructor||'Instrutor não informado')+' · '+esc(l.vehicle||s.vehicle)+'</small>'+(l.notes?'<small>'+esc(l.notes)+'</small>':'')+'<div class="lessonactions"><button data-editlesson="'+esc(l.id)+'">Editar</button><button data-dellesson="'+esc(l.id)+'">Excluir</button></div></article>'});view.innerHTML=html+(lessons.length?'':'<div class="empty">Nenhuma aula registrada ainda.</div>')+'<p class="note">Somente aulas marcadas como Realizada contam como presença e são descontadas do pacote. Faltas, cancelamentos e reagendamentos ficam registrados separadamente.</p><div class="actions"><button class="btn danger" data-delete="'+esc(s.id)+'">Excluir aluno</button></div>'}
async function lessonForm(edit){var allL=await all('aulas'),l=edit?allL.find(function(x){return x.id===edit}):{};view.innerHTML=title(l.id?'Editar aula':'Registrar aula','Aluno: '+esc((await all('alunos')).find(function(x){return x.id===studentId}).name),'<button class="btn" data-detail>Voltar</button>')+'<form id="lessonForm" class="panel grid"><input type="hidden" name="id" value="'+esc(l.id)+'"><label class="field">Data<input type="date" name="date" required value="'+esc(l.date||today())+'"></label><label class="field">Horário<input type="time" name="time" required value="'+esc(l.time||'08:00')+'"></label><label class="field">Situação<select name="status">'+['Agendada','Realizada','Faltou','Cancelada','Reagendada'].map(function(x){return '<option '+((l.status||'Agendada')===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></label><label class="field">Duração (min)<input type="number" name="duration" min="1" max="300" value="'+esc(l.duration||50)+'"></label><label class="field">Instrutor<input name="instructor" value="'+esc(l.instructor)+'"></label><label class="field">Veículo<input name="vehicle" value="'+esc(l.vehicle||'')+'"></label><label class="field" style="grid-column:1/-1">Observações<textarea name="notes">'+esc(l.notes)+'</textarea></label><div class="actions"><button type="button" class="btn" data-detail>Cancelar</button><button type="button" class="btn primary" id="saveLessonButton">Salvar aula</button></div></form>'}
async function backup(){var students=await all('alunos'),lessons=await all('aulas');var blob=new Blob([JSON.stringify({app:'AutoGestor CFC',version:1,exported:new Date().toISOString(),students:students,lessons:lessons},null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='backup-autogestor-'+today()+'.json';a.click();URL.revokeObjectURL(url)}
async function dataPage(){var students=await all('alunos'),lessons=await all('aulas');view.innerHTML=title('Dados e segurança','Faça cópias de segurança dos registros.')+'<div class="stats"><div class="stat"><span>Alunos</span><strong>'+students.length+'</strong></div><div class="stat"><span>Aulas</span><strong>'+lessons.length+'</strong></div><div class="stat"><span>Presenças</span><strong>'+lessons.filter(function(x){return x.status==='Realizada'}).length+'</strong></div><div class="stat"><span>Faltas</span><strong>'+lessons.filter(function(x){return x.status==='Faltou'}).length+'</strong></div></div><div class="panel"><h2>Exportar backup</h2><p class="muted">Baixe um arquivo com todos os alunos e históricos.</p><br><button class="btn primary" id="export">Baixar backup</button><hr style="border-color:var(--line);margin:20px 0"><h2>Restaurar backup</h2><p class="muted">A restauração substitui os dados atuais. Faça um backup antes.</p><br><button class="btn" id="restore">Escolher arquivo</button></div><p class="note">Os dados ficam apenas neste aparelho, usando IndexedDB. Fechar o aplicativo não apaga os registros. Limpar os dados do navegador, remover o armazenamento do site ou perder o aparelho pode apagar os cadastros. Faça backups regulares.</p>'}
async function render(){nav();if(tab==='inicio'||tab==='alunos')return home();if(tab==='novo')return studentForm();if(tab==='dados')return dataPage()}
document.addEventListener('click',async function(e){var b=e.target.closest('button');if(!b)return;if(b.id==='saveStudentButton'){e.preventDefault();var saveBtn=b;try{var form=document.getElementById('studentForm');if(!form||!form.elements.namedItem('name').reportValidity())return;saveBtn.disabled=true;saveBtn.textContent='Salvando...';var student=Object.fromEntries(new FormData(form).entries());student.id=student.id||id();student.total=Number(student.total||0);await put('alunos',student);alert('Aluno salvo com sucesso!');tab='alunos';await render()}catch(err){console.error('Erro ao salvar aluno:',err);alert('Não foi possível salvar o aluno. O armazenamento do aparelho informou: '+(err&&err.message?err.message:'erro desconhecido')+'. Tente novamente.')}finally{saveBtn.disabled=false;saveBtn.textContent='Salvar aluno'}return}if(b.id==='saveLessonButton'){e.preventDefault();var lessonBtn=b;try{var lf=document.getElementById('lessonForm');if(!lf)return;if(!lf.reportValidity())return;lessonBtn.disabled=true;lessonBtn.textContent='Salvando...';var lesson=Object.fromEntries(new FormData(lf).entries());lesson.id=lesson.id||id();lesson.alunoId=studentId;lesson.duration=Number(lesson.duration||0);await put('aulas',lesson);alert('Aula salva com sucesso!');await detail(studentId)}catch(err){console.error('Erro ao salvar aula:',err);alert('Não foi possível salvar a aula: '+(err&&err.message?err.message:'erro desconhecido'))}finally{lessonBtn.disabled=false;lessonBtn.textContent='Salvar aula'}return}if(b.dataset.tab){tab=b.dataset.tab;return render()}if(b.hasAttribute('data-new'))return studentForm();if(b.dataset.open)return detail(b.dataset.open);if(b.hasAttribute('data-home')){tab='inicio';return render()}if(b.dataset.edit){var s=(await all('alunos')).find(function(x){return x.id===b.dataset.edit});return studentForm(s)}if(b.hasAttribute('data-lesson'))return lessonForm();if(b.hasAttribute('data-detail'))return detail(studentId);if(b.dataset.editlesson)return lessonForm(b.dataset.editlesson);if(b.dataset.dellesson){if(confirm('Excluir este registro de aula?')){await del('aulas',b.dataset.dellesson);return detail(studentId)}}if(b.dataset.delete){if(confirm('Excluir o aluno e todo o histórico dele?')){for(var l of (await all('aulas')).filter(function(x){return x.alunoId===b.dataset.delete}))await del('aulas',l.id);await del('alunos',b.dataset.delete);tab='alunos';return render()}}if(b.id==='backupTop')return dataPage();if(b.id==='export')return backup();if(b.id==='restore')return document.getElementById('file').click()});
document.addEventListener('submit',function(e){if(e.target.id==='studentForm'||e.target.id==='lessonForm')e.preventDefault()});
document.addEventListener('input',function(e){if(e.target.id==='search'){var v=e.target.value;home(v).then(function(){var el=document.getElementById('search');if(el){el.focus();el.setSelectionRange(v.length,v.length)}})}});
document.getElementById('file').addEventListener('change',async function(e){var f=e.target.files[0];if(!f)return;try{var data=JSON.parse(await f.text());if(!Array.isArray(data.students)||!Array.isArray(data.lessons))throw Error('Arquivo inválido');if(!confirm('Isso substituirá os registros atuais. Continuar?'))return;var tx=db.transaction(['alunos','aulas'],'readwrite');tx.objectStore('alunos').clear();tx.objectStore('aulas').clear();data.students.forEach(function(x){tx.objectStore('alunos').put(x)});data.lessons.forEach(function(x){tx.objectStore('aulas').put(x)});tx.oncomplete=function(){alert('Backup restaurado com sucesso.');tab='inicio';render()}}catch(err){alert('Não foi possível restaurar: arquivo inválido.')}e.target.value=''});
openDB().then(render).catch(function(){view.innerHTML='<div class="empty">Não foi possível abrir o armazenamento local. Abra o aplicativo em um navegador atualizado e permita o armazenamento.</div>'});
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})});
})();
</script></body></html>
